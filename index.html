<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebene-Vento Technology | Websites for Local Businesses</title>
<meta name="description" content="Demo websites for restaurants, salons, electricians, plumbers, housekeepers, schools, event planners and boutiques in Nigeria.">
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#0b1020;--panel:#141b34;--ink:#f4f1ff;--muted:#aab0d4;--yellow:#ffe01b;--purple:#8b5cf6;--pink:#ec4899;--cyan:#12b8ff;--line:#26305a}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;overflow-x:hidden;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.04;margin:0 0 14px;letter-spacing:-.03em}
h2{font-size:1.6rem;margin:0 0 10px}
p{margin:0 0 12px}
button{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
/* hub */
#hub{background:radial-gradient(600px 420px at 10% 0,rgba(139,92,246,.4),transparent),radial-gradient(500px 400px at 100% 20%,rgba(236,72,153,.28),transparent),var(--bg);min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top b{color:var(--yellow)}
.hub h1{background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--yellow));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 9s linear infinite;margin-top:28px}
@keyframes flow{to{background-position:250% 0}}
.hub p{color:var(--muted);max-width:60ch}
.btn,.sb{display:inline-block;padding:13px 22px;border:0;border-radius:12px;font-weight:800;text-decoration:none;cursor:pointer;background:var(--yellow);color:#1b1500}
