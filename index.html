<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebene-Vento Technology | Websites for Local Businesses</title>
<meta name="description" content="Demo websites for restaurants, salons, electricians, plumbers, housekeepers, schools, event planners and boutiques in Nigeria.">
<meta name="theme-color" content="#0b1020">
<style>
:root{--bg:#0b1020;--panel:#141b34;--ink:#f4f1ff;--muted:#aab0d4;--yellow:#ffe01b;--purple:#8b5cf6;--pink:#ec4899;--cyan:#12b8ff;--line:#26305a}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.55;overflow-x:hidden;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
a{color:inherit}
h1{font-size:clamp(2.2rem,8vw,4rem);line-height:1.04;margin:0 0 14px;letter-spacing:-.03em}
h2{font-size:1.6rem;margin:0 0 10px}
p{margin:0 0 12px}
button{font:inherit}
.wrap{max-width:980px;margin:0 auto;padding:0 18px}
/* hub */
#hub{background:radial-gradient(600px 420px at 10% 0,rgba(139,92,246,.4),transparent),radial-gradient(500px 400px at 100% 20%,rgba(236,72,153,.28),transparent),var(--bg);min-height:100vh}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,0px))}
.top b{color:var(--yellow)}
.hub h1{background:linear-gradient(90deg,var(--yellow),var(--pink),var(--cyan),var(--yellow));background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:flow 9s linear infinite;margin-top:28px}
@keyframes flow{to{background-position:250% 0}}
.hub p{color:var(--muted);max-width:60ch}
.btn,.sb{display:inline-block;padding:13px 22px;border:0;border-radius:12px;font-weight:800;text-decoration:none;cursor:pointer;background:var(--yellow);color:#1b1500}
.btn.alt{background:transparent;color:var(--ink);border:2px solid var(--purple)}
.btn.sm{padding:8px 14px;font-size:.88rem;border-radius:10px}
.btn.red{background:#ff5d6c;color:#fff}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:18px 0 40px}
.dc{display:block;text-decoration:none;background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.dc:hover{border-color:var(--yellow)}
.tile{height:130px;display:flex;align-items:center;justify-content:center;font-size:3.6rem}
.dc div.t{padding:14px}
.dc h3{margin:0 0 4px;font-size:1.05rem}
.dc small{color:var(--muted)}
.dc em{display:inline-block;margin-top:8px;font-style:normal;color:var(--cyan);font-weight:700;font-size:.9rem}
.ft{padding:24px 0 10px;color:var(--muted);font-size:.9rem}
/* demo site */
#site{--c1:#6d28d9;--c2:#ec4899;background:#faf8ff;background:color-mix(in srgb,var(--c1) 7%,#fff);color:#1d1b3a;min-height:100vh}
.sbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#fff;border-bottom:1px solid #e6e1f5;white-space:nowrap;overflow:hidden}
.sbar strong{color:var(--c1);min-width:0;overflow:hidden;text-overflow:ellipsis}
.sbar a{flex:none}
.back,.sbtn{text-decoration:none;font-size:.88rem;font-weight:700;padding:7px 12px;border-radius:99px;border:1px solid #d9d2f5}
.sbtn{background:var(--c1);color:#fff;border-color:var(--c1)}
.shero{position:relative;background:linear-gradient(135deg,var(--c1),var(--c2));background-size:cover;background-position:center;color:#fff;padding:48px 0 56px}
.shero .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px}
.hin{max-width:540px}
.shero p{font-size:1.1rem;opacity:.95}
.hico{font-size:clamp(4rem,18vw,9rem);filter:drop-shadow(0 8px 20px rgba(0,0,0,.3))}
.sb{background:#ffe01b}
.sb.alt{background:rgba(255,255,255,.2);color:#fff;border:2px solid #fff}
.sec{padding:44px 0 4px}
.sec h2{color:var(--c1)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:14px}
.g{position:relative;aspect-ratio:1;border-radius:16px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:3.4rem;border:0;padding:0;color:#fff}
.g img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.g span{position:absolute;left:0;right:0;bottom:0;padding:18px 10px 8px;font-size:.88rem;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.65));text-align:left}
.item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e6e1f5;border-radius:16px;padding:14px;margin-top:10px}
.item div.i{flex:1}
.item b{display:block}
.item small{color:#6b7190}
.pr{font-weight:800;color:var(--c1);white-space:nowrap}
.step{display:flex;align-items:center;gap:8px}
.step button{width:34px;height:34px;border-radius:50%;border:1px solid var(--c1);background:#fff;color:var(--c1);font-size:1.2rem;cursor:pointer;line-height:1}
.step button:last-child{background:var(--c1);color:#fff}
.step b{min-width:18px;text-align:center}
.pan{background:#fff;border:1px solid #e6e1f5;border-radius:18px;padding:18px;margin-top:12px}
.pan label{display:block;font-weight:700;font-size:.88rem;margin:12px 0 4px}
.pan input,.pan textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #d9d2f5;font:inherit;color:#1d1b3a;background:#fff}
.tot{font-size:1.5rem;font-weight:800;color:var(--c1)}
.sum{white-space:pre-line;color:#4a4a6a;margin:6px 0}
.wb{background:#25d366;color:#fff;border:0;border-radius:12px;padding:14px 22px;font-weight:800;cursor:pointer;margin-top:12px;width:100%;font-size:1rem}
.rev{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin-top:12px}
.rev div{background:#fff;border:1px solid #e6e1f5;border-radius:16px;padding:16px}
.rev small{color:#6b7190}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:25;background:var(--c1,#6d28d9);color:#fff;border:0;border-radius:99px;padding:12px 22px;font-weight:800;box-shadow:0 6px 24px rgba(0,0,0,.35);cursor:pointer}
.ban{margin:44px 0 20px;background:#1d1b3a;color:#fff;border-radius:18px;padding:20px}
.ban p{color:#c9c4ee}
.note{font-size:.82rem;color:#6b7190}
#lb{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.96);display:flex;align-items:center;justify-content:center;padding:16px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%}
footer{position:fixed;left:0;right:0;bottom:0;padding-bottom:env(safe-area-inset-bottom,0px);background:linear-gradient(90deg,#2a1070,#6d28d9,#2a1070);border-top:1px solid var(--yellow);overflow:hidden;white-space:nowrap;z-index:30}
.mq{display:inline-block;padding:16px 0;font-weight:800;letter-spacing:.04em;color:var(--yellow);text-shadow:0 0 12px rgba(255,224,27,.6);animation:scroll 16s linear infinite}
footer:hover .mq{animation-play-state:paused}
@keyframes scroll{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
/* admin */
#admin{position:fixed;inset:0;z-index:60;background:var(--bg);color:var(--ink);overflow:auto;padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:50px}
.adm{max-width:640px;margin:0 auto}
.adm h3{margin:24px 0 6px}
.adm label{display:block;font-weight:600;font-size:.86rem;margin:10px 0 4px}
.adm input,.adm textarea,.adm select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:#0d1330;color:var(--ink);font:inherit}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:10px}
.box img{width:100%;max-height:180px;object-fit:contain;border-radius:8px;background:#0d1330;display:block;margin-bottom:8px}
.tip{background:rgba(255,224,27,.1);border:1px dashed var(--yellow);border-radius:12px;padding:12px;font-size:.9rem;margin-top:12px}
#st{min-height:1.4em;color:var(--cyan);font-size:.9rem;margin-top:10px}
:is(.btn,.sb,button,a,input,select,textarea):focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.mq{animation:none;display:block;text-align:center}.hub h1{animation:none}html{scroll-behavior:auto}}
</style>
</head>
